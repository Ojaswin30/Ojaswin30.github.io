<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Ojaswin Aggarwal</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23c0522a'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f0e8;
      --paper2: #ede8df;
      --ink: #1c1810;
      --muted: #5e5445;
      --rust: #c0522a;
      --rust2: #e8673a;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'DM Sans', sans-serif;
    }
    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      line-height: 1.6;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--rust) 0%, var(--rust2) 50%, #2a7a6f 100%);
    }
    .code {
      font-family: var(--serif);
      font-size: clamp(5rem, 12vw, 8rem);
      font-weight: 700;
      color: var(--rust);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
    }
    p {
      color: var(--muted);
      max-width: 480px;
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
    .btn {
      display: inline-block;
      background: var(--rust);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.85rem 1.75rem;
      border-radius: 4px;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover {
      background: var(--rust2);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you’re looking for doesn’t exist, was moved, or has vanished into the pipeline void.</p>
  <a href="/" class="btn">← Back to Homepage</a>
</body>
</html>
